name: 'E2E'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.claude/**'
      - '.agents/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.claude/**'
      - '.agents/**'

permissions:
  contents: read

jobs:
  playwright:
    name: E2E Tests
    timeout-minutes: 60
    # matches the runner of the e2e job in glsp-core, where the same Playwright suites are green
    runs-on: ubuntu-22.04
    env:
      GLSP_SERVER_PORT: '8081'
      # the suites assert the labels and popup texts of the Java server and skip the browser
      # project; it also implies GLSP_SERVER_EXTERNAL, so Playwright starts the client only
      GLSP_SERVER_TYPE: 'java'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # provides the diagram client (examples/workflow-standalone) and the shared Playwright
      # suites (e2e/workflow-e2e) that the Java Workflow server is tested against
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: 'eclipse-glsp/glsp-core'
          path: 'glsp-core'
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build Workflow server fatjar
        run: mvn clean package -Pm2 -Pfatjar -B -DskipTests -Dcheckstyle.skip
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: glsp-core/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: glsp-core/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: glsp-core
        run: pnpm install --frozen-lockfile
      # Playwright serves the built bundles of the workflow example and does not compile them.
      - name: Build glsp-core
        working-directory: glsp-core
        run: pnpm build
      - name: Start Workflow GLSP server
        run: |
          jar=$(ls examples/org.eclipse.glsp.example.workflow/target/*-glsp.jar)
          java -jar "$jar" --websocket --port "$GLSP_SERVER_PORT" > glsp-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/"$GLSP_SERVER_PORT") 2>/dev/null; then
              echo "Workflow GLSP server is listening on port $GLSP_SERVER_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Workflow GLSP server did not start within 60s"
          cat glsp-server.log
          exit 1
      # the Java server is already running, so only the client is started by Playwright
      - name: Run Playwright tests
        working-directory: glsp-core
        run: pnpm e2e test:standalone
      - name: Print Workflow GLSP server log
        if: failure()
        run: cat glsp-server.log
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: glsp-core/e2e/*/playwright-report/
