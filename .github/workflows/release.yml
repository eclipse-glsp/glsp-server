name: Release

# Publishes a release when its signed tag v<version> is pushed.
on:
  push:
    # final releases only; snapshots, release candidates and javax tags (v<version>.javax) never start a run
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  # a half-finished upload to download.eclipse.org or Central must never be cancelled
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check release tag
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: github.repository == 'eclipse-glsp/glsp-server'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check that the tag matches the project version
        run: |
          grep -m1 '<version>' pom.xml | grep -qF "<version>${GITHUB_REF_NAME#v}</version>" \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match the version in pom.xml"; exit 1; }
      - name: Check that the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        # a lightweight tag has no tag object and therefore no signature
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          if [[ -z "$TAG_SHA" || $(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq .verification.verified) != "true" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a signed tag verified by GitHub"
            exit 1
          fi
      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json conclusion --jq '.[0].conclusion')
          [[ "$CI" == "success" ]] || { echo "::error::ci.yml has not passed on $GITHUB_SHA. Re-run this job once it has."; exit 1; }

  p2:
    name: Publish P2 release update site
    needs: check
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build p2 repository
        run: mvn clean install -Pp2 -B

      - name: Set up SSH access to projects-storage.eclipse.org
        env:
          SCP_KEY: ${{ secrets.SCP_KEY }}
          SCP_PASSPHRASE: ${{ secrets.SCP_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SCP_KEY" >~/.ssh/id_ed25519
          # the bot key is passphrase-protected; strip the passphrase from the on-disk
          # copy so the rsync/ssh steps need neither an agent nor an interactive prompt
          ssh-keygen -p -P "$SCP_PASSPHRASE" -N '' -f ~/.ssh/id_ed25519
          ssh-keyscan projects-storage.eclipse.org >>~/.ssh/known_hosts

      - name: Upload release update site
        env:
          REMOTE: ${{ secrets.SCP_USERNAME }}@projects-storage.eclipse.org
        run: |
          TARGET="/home/data/httpd/download.eclipse.org/glsp/server/p2/releases/${GITHUB_REF_NAME#v}"
          ssh "$REMOTE" "test ! -e $TARGET" || { echo "::error::$TARGET already exists (or the server is unreachable). If m2 failed after this upload, use 'Re-run failed jobs' instead of 'Re-run all jobs'."; exit 1; }
          # upload to a temporary dir first so a failed upload never looks like a complete release
          rsync -az --delete --exclude='.*' releng/org.eclipse.glsp.repository/target/repository/ "$REMOTE:$TARGET.tmp/"
          ssh "$REMOTE" "test ! -e $TARGET && mv $TARGET.tmp $TARGET"

  m2:
    name: Deploy release to Maven Central
    # Central is irreversible, so it runs only once the p2 upload has succeeded
    needs: [check, p2]
    # room for the build plus the plugin's own 30 minute waitUntil=published limit; a re-run after Central accepted the bundle fails
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # generates the settings.xml for the 'central' server and imports the signing key
      - name: Set up JDK & Maven Central credentials
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # the test modules are not published; they are built and run by the CI workflow
        run: |
          mvn clean deploy -Pm2 -Pm2-release -Pfatjar -B \
            -Dgpg.keyname="${{ secrets.GPG_KEY_ID }}" \
            -pl '!tests,!tests/org.eclipse.glsp.server.test,!tests/org.eclipse.glsp.graph.test'
